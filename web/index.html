<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />

    <!-- Primary Meta Tags -->
    <title>TOKEX | Multi-Model Gateway</title>
    <meta name="title" content="TOKEX | Multi-Model Gateway" />
    <meta
      name="description"
      content="TOKEX enterprise multi-model AI gateway, unified routing, and API governance platform."
    />

    <meta name="theme-color" content="#06080e" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Resolve the theme before first paint so the page never flashes light
         and one-shot detectors (e.g. Dark Reader) see the real theme.
         Keep in sync with ThemeProvider and THEME_STORAGE_KEYS.mode. -->
    <script>
      ;(function () {
        try {
          localStorage.setItem('newapi:theme:v1:mode', 'dark')
        } catch (e) {}
        document.documentElement.classList.remove('light', 'dark')
        document.documentElement.classList.add('dark')
      })()
    </script>
    <!--umami-->
    <!--Google Analytics-->
  </head>

  <body>
    <div id="root" translate="no" class="notranslate"></div>
  </body>
</html>
