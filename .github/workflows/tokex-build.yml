name: Build & Publish TOKEX (Web + ARM64 Image)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: tokex-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-web:
    name: Build web-dist artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          test -n "$VERSION"
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'

      - name: Install dependencies & typecheck
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun check -b

      - name: Build web/dist
        working-directory: web
        env:
          CI: ""
          DISABLE_ESLINT_PLUGIN: "true"
          VITE_REACT_APP_VERSION: ${{ steps.version.outputs.version }}
        run: bun run build

      - name: Upload web-dist artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-dist
          path: web/dist/
          if-no-files-found: error
          retention-days: 14

  build-docker:
    name: Build & push tokex-web (linux/arm64)
    needs: build-web
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Resolve version & tags
        id: version
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          test -n "$VERSION"
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum
            tokenkit/go.sum
            pluginkit/go.sum

      - name: Download web-dist artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-dist
          path: web/dist

      - name: Build Go binary & runtime Docker context
        env:
          GO111MODULE: on
          CGO_ENABLED: '0'
          GOWORK: off
          GOOS: linux
          GOARCH: arm64
          GOEXPERIMENT: greenteagc
        run: |
          go mod download
          mkdir -p /tmp/tokex-docker-ctx
          go build \
            -pgo="$(go list -m -f '{{.Dir}}' github.com/MoeForge/moejs)/default.pgo" \
            -ldflags "-s -w -X 'github.com/QuantumNous/new-api/common.Version=${{ steps.version.outputs.version }}'" \
            -o /tmp/tokex-docker-ctx/new-api
          cp LICENSE NOTICE THIRD-PARTY-LICENSES.md /tmp/tokex-docker-ctx/
          cat <<'EOF' > /tmp/tokex-docker-ctx/Dockerfile
          FROM debian:bookworm-slim@sha256:f06537653ac770703bc45b4b113475bd402f451e85223f0f2837acbf89ab020a

          RUN apt-get update \
              && apt-get install -y --no-install-recommends ca-certificates tzdata libasan8 wget \
              && rm -rf /var/lib/apt/lists/* \
              && update-ca-certificates

          COPY new-api /new-api
          COPY LICENSE NOTICE THIRD-PARTY-LICENSES.md /licenses/
          EXPOSE 3000
          WORKDIR /data
          ENTRYPOINT ["/new-api"]
          EOF

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/leoravyn/tokex-web

      - name: Build & push ARM64 image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: /tmp/tokex-docker-ctx
          file: /tmp/tokex-docker-ctx/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/leoravyn/tokex-web:latest
            ghcr.io/leoravyn/tokex-web:${{ steps.version.outputs.short_sha }}
            ghcr.io/leoravyn/tokex-web:${{ steps.version.outputs.version }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=tokex-arm64-runtime
          cache-to: type=gha,scope=tokex-arm64-runtime,mode=max

      - name: Image summary
        run: |
          echo "### TOKEX ARM64 Image" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/leoravyn/tokex-web:latest" >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/leoravyn/tokex-web:${{ steps.version.outputs.short_sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/leoravyn/tokex-web:${{ steps.version.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "version: ${{ steps.version.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "digest: ${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
