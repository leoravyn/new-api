name: TOKEX Dev Go Tests

on:
  push:
    branches:
      - dev
    paths:
      - '*.go'
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'relaykit/**'
      - 'tokenkit/**'
      - 'makefile'
      - '.github/workflows/tokex-dev-test.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tokex-dev-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-test:
    name: Backend vet and test (cloud)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOWORK: 'off'

    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum
            tokenkit/go.sum

      - name: Create frontend embed placeholder
        run: |
          mkdir -p web/dist
          touch web/dist/index.html

      - name: Vet root, relaykit, and tokenkit modules
        run: |
          go vet ./...
          (cd relaykit && go vet ./...)
          (cd tokenkit && go vet ./...)

      - name: Run Go unit tests
        run: make test
